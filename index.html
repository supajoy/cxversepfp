<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linkedin frame</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #2a2f3a;
    --text: #e9ecf1;
    --muted: #8b93a3;
    --accent: #6aa0ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 12px; color: var(--muted); }
  button, .filebtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    padding: 0 14px;
    background: #20242d;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  button:hover, .filebtn:hover { border-color: #3a4150; }
  button.primary { background: var(--accent); color: #0a0f1c; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.05); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  input[type="file"] { display: none; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
  main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    overflow: auto;
  }
  .stage {
    position: relative;
    width: min(720px, 80vh);
    aspect-ratio: 1 / 1;
    background:
      linear-gradient(45deg, #1a1d24 25%, transparent 25%),
      linear-gradient(-45deg, #1a1d24 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1d24 75%),
      linear-gradient(-45deg, transparent 75%, #1a1d24 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    background-color: #11141a;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    cursor: grab;
  }
  .stage.dragging { cursor: grabbing; }
  canvas { width: 100%; height: 100%; display: block; }
  .empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; pointer-events: none;
  }
</style>
</head>
<body>
<aside>
  <div>
    <h1>linkedin frame</h1>
    <div class="sub">1000 × 1000 png export</div>
  </div>

  <div class="group">
    <label>photo</label>
    <label class="filebtn" for="file">choose image</label>
    <input id="file" type="file" accept="image/*" />
  </div>

  <div class="group">
    <label>zoom <span id="zoomVal" style="color:var(--text)">1.00×</span></label>
    <input id="zoom" type="range" min="0.2" max="5" step="0.01" value="1" />
  </div>

  <div class="row">
    <button id="reset">reset</button>
    <button id="download" class="primary" disabled>download png</button>
  </div>

  <div class="hint">drag inside the circle to reposition. scroll to zoom.</div>
</aside>

<main>
  <div class="stage" id="stage">
    <canvas id="canvas" width="1000" height="1000"></canvas>
    <div class="empty" id="empty">upload a photo to begin</div>
  </div>
</main>

<script>
(() => {
  const SIZE = 1000;
  const CX = 500, CY = 500, R = 472;

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const fileInput = document.getElementById('file');
  const zoom = document.getElementById('zoom');
  const zoomVal = document.getElementById('zoomVal');
  const resetBtn = document.getElementById('reset');
  const downloadBtn = document.getElementById('download');
  const stage = document.getElementById('stage');
  const empty = document.getElementById('empty');

  const frame = new Image();
  frame.src = 'frame.png';

  let photo = null;
  let state = { scale: 1, ox: 0, oy: 0 };

  frame.onload = render;

  function fitScale(img) {
    return Math.max((2 * R) / img.width, (2 * R) / img.height);
  }

  function render() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    if (photo) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.clip();
      const s = state.scale * fitScale(photo);
      const w = photo.width * s;
      const h = photo.height * s;
      ctx.drawImage(photo, CX - w / 2 + state.ox, CY - h / 2 + state.oy, w, h);
      ctx.restore();
    }
    if (frame.complete) ctx.drawImage(frame, 0, 0, SIZE, SIZE);
  }

  fileInput.addEventListener('change', (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      photo = img;
      state = { scale: 1, ox: 0, oy: 0 };
      zoom.value = 1;
      zoomVal.textContent = '1.00×';
      empty.style.display = 'none';
      downloadBtn.disabled = false;
      render();
    };
    img.src = URL.createObjectURL(f);
  });

  zoom.addEventListener('input', () => {
    state.scale = parseFloat(zoom.value);
    zoomVal.textContent = state.scale.toFixed(2) + '×';
    render();
  });

  resetBtn.addEventListener('click', () => {
    if (!photo) return;
    state = { scale: 1, ox: 0, oy: 0 };
    zoom.value = 1;
    zoomVal.textContent = '1.00×';
    render();
  });

  // drag
  let dragging = false;
  let dragStart = null;
  const toCanvas = (e) => {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * SIZE,
      y: ((e.clientY - rect.top) / rect.height) * SIZE,
    };
  };
  stage.addEventListener('pointerdown', (e) => {
    if (!photo) return;
    dragging = true;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
    const p = toCanvas(e);
    dragStart = { x: p.x, y: p.y, ox: state.ox, oy: state.oy };
  });
  stage.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const p = toCanvas(e);
    state.ox = dragStart.ox + (p.x - dragStart.x);
    state.oy = dragStart.oy + (p.y - dragStart.y);
    render();
  });
  const endDrag = (e) => {
    dragging = false;
    stage.classList.remove('dragging');
    if (e?.pointerId !== undefined && stage.hasPointerCapture(e.pointerId)) {
      stage.releasePointerCapture(e.pointerId);
    }
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  // wheel zoom
  stage.addEventListener('wheel', (e) => {
    if (!photo) return;
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0015);
    const next = Math.min(5, Math.max(0.2, state.scale * factor));
    state.scale = next;
    zoom.value = next;
    zoomVal.textContent = next.toFixed(2) + '×';
    render();
  }, { passive: false });

  downloadBtn.addEventListener('click', () => {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'linkedin-1000.png';
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  });
})();
</script>
</body>
</html>
